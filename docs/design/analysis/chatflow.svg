t-size="12" font-weight="normal" fill="#16231E" text-anchor="middle">Rasa replies</text><text x="250" y="411.4" font-family="Liberation Sans" font-size="12" font-weight="normal" fill="#16231E" text-anchor="middle">within 3 s?</text><polyline points="135,400 70,400 70,470" fill="none" stroke="#33443d" stroke-width="1.5" marker-end="url(#arr)"/><rect x="10.0" y="471.0" width="120" height="58" rx="0" fill="white" stroke="#2F7A5D" stroke-width="1.4"/><text x="70.0" y="497.0" font-family="Liberation Sans" font-size="12" font-weight="normal" fill="#16231E" text-anchor="middle">Backup model</text><text x="70.0" y="511.4" font-family="Liberation Sans" font-size="12" font-weight="normal" fill="#16231E" text-anchor="middle">(threshold 0.35)</text><polyline points="250,440 250,475" fill="none" stroke="#33443d" stroke-width="1.5" marker-end="url(#arr)"/><rect x="170.0" y="475.0" width="160" height="50" rx="0" fill="white" stroke="#2F7A5D" stroke-width="1.4"/><text x="250.0" y="497.0" font-family="Liberation Sans" font-size="12" font-weight="normal" fill="#16231E" text-anchor="middle">Rasa intent</text><text x="250.0" y="511.4" font-family="Liberation Sans" font-size="12" font-weight="normal" fill="#16231E" text-anchor="middle">(threshold 0.5)</text><polyline points="250,525 250,565" fill="none" stroke="#33443d" stroke-width="1.5" marker-end="url(#arr)"/><polyline points="70,529 70,545 250,545" fill="none" stroke="#33443d" stroke-width="1.5"/><polygon points="250,565.0 365.0,605 250,645.0 135.0,605" fill="#FFF7E6" stroke="#B7862B" stroke-width="1.6"/><text x="250" y="602.0" font-family="Liberation Sans" font-size="12" font-weight="normal" fill="#16231E" text-anchor="middle">Confident</text><text x="250" y="616.4" font-family="Liberation Sans" font-size="12" font-weight="normal" fill="#16231E" text-anchor="middle">enough?</text><polyline points="135,605 70,605 70,628" fill="none" stroke="#33443d" stroke-width="1.5" marker-end="url(#arr)"/><rect x="7.5" y="628.0" width="125" heigh
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  flutter:
    name: Analyze, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates android/ and web/ folders only if they are not committed yet.
      # Existing files (lib/, test/, pubspec.yaml) are never overwritten.
      - name: Ensure platform folders
        run: |
          if [ ! -d android ] || [ ! -d web ]; then
            flutter create . --platforms=android,web --org ke.ac.maseno --project-name mindquest
          fi

      - name: Install packages
        run: flutter pub get

      - name: Check formatting
        run: |
          dart format --output=none --set-exit-if-changed lib test | sed -n 's/^Changed \(.*\)$/::warning file=\1::File is not formatted (run dart format)/p'
          exit ${PIPESTATUS[0]}
        continue-on-error: true
        shell: bash

      - name: Analyze
        shell: bash
        run: |
          # Machine output turned into GitHub annotations so problems show on the run page.
          set +e
          dart analyze --format=machine --fatal-warnings lib test > analyze.txt 2>&1
          code=$?
          awk -F'|' 'NF>=8 {f=$4; sub(ENVIRON["GITHUB_WORKSPACE"]"/","",f); lvl=($1=="ERROR")?"error":"warning"; printf "::%s file=%s,line=%s,col=%s::%s %s\n", lvl, f, $5, $6, $3, $8}' analyze.txt
          cat analyze.txt
          exit $code

      - name: Run tests
        shell: bash
        run: |
          # Failures are also turned into annotations so they show on the run page.
          set +e
          flutter test --reporter expanded > test-output.txt 2>&1
          code=$?
          cat test-output.txt
          if [ $code -ne 0 ]; then
            grep -A2 -E "\[E\]|Expected:|Actual:|Which:|The following|overflowed|error-causing widget" test-output.txt \
              | grep -v -E "^--$|^\s*$" | head -60 | sed 's/^/::error::/'
          fi
          exit $code

      - name: Build web
        run: flutter build web --release

      - name: Build admin dashboard (web)
        run: flutter build web --release -t lib/main_admin.dart

      - name: Build Android APK (debug)
        run: flutter build apk --debug || (echo "Retrying after a build error..." && sleep 30 && flutter build apk --debug)


      - name: Build Android APK (release, arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: mindquest-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  chat-function:
    name: Edge function tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions/chat
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format and lint
        run: deno fmt --check && deno lint

      - name: Type check
        run: deno check index.ts

      - name: Unit tests
        run: deno test

      - name: Delete-account function (format, lint, type check)
        working-directory: supabase/functions/delete-account
        run: deno fmt --check && deno lint && deno check index.ts

      - name: Health function (format, lint, type check)
        working-directory: supabase/functions/health
        run: deno fmt --check && deno lint && deno check index.ts

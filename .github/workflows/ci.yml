name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  flutter:
    name: Analyze, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generates android/ and web/ folders only if they are not committed yet.
      # Existing files (lib/, test/, pubspec.yaml) are never overwritten.
      - name: Ensure platform folders
        run: |
          if [ ! -d android ] || [ ! -d web ]; then
            flutter create . --platforms=android,web --org ke.ac.maseno --project-name mindquest
          fi

      - name: Install packages
        run: flutter pub get

      - name: Check formatting
        run: |
          dart format --output=none --set-exit-if-changed lib test | sed -n 's/^Changed \(.*\)$/::warning file=\1::File is not formatted (run dart format)/p'
          exit ${PIPESTATUS[0]}
        continue-on-error: true
        shell: bash

      - name: Analyze
        shell: bash
        run: |
          # Machine output turned into GitHub annotations so problems show on the run page.
          set +e
          dart analyze --format=machine --fatal-warnings lib test > analyze.txt 2>&1
          code=$?
          awk -F'|' 'NF>=8 {f=$4; sub(ENVIRON["GITHUB_WORKSPACE"]"/","",f); lvl=($1=="ERROR")?"error":"warning"; printf "::%s file=%s,line=%s,col=%s::%s %s\n", lvl, f, $5, $6, $3, $8}' analyze.txt
          cat analyze.txt
          exit $code

      - name: Run tests
        shell: bash
        run: |
          # Failures are also turned into annotations so they show on the run page.
          set +e
          flutter test --reporter expanded > test-output.txt 2>&1
          code=$?
          cat test-output.txt
          if [ $code -ne 0 ]; then
            grep -A2 -E "\[E\]|Expected:|Actual:|Which:|The following|overflowed|error-causing widget" test-output.txt \
              | grep -v -E "^--$|^\s*$" | head -60 | sed 's/^/::error::/'
          fi
          exit $code

      # The web version: CanvasKit is served from the site itself (not a CDN)
      # so the offline cache (web/sw.js) can keep it.
      - name: Build web
        run: |
          flutter build web --release --no-web-resources-cdn
          grep -q startOfflineCache build/web/flutter_bootstrap.js
          test -f build/web/sw.js
          test -f build/web/canvaskit/canvaskit.wasm

      - name: Build admin dashboard (web)
        run: flutter build web --release -t lib/main_admin.dart

      - name: Build Android APK (debug)
        run: flutter build apk --debug || (echo "Retrying after a build error..." && sleep 30 && flutter build apk --debug)


      - name: Build Android APK (release, arm64)
        run: flutter build apk --release --target-platform android-arm64

      # Kept for 3 days only: GitHub's free artifact storage fills up
      # quickly with one APK per push. A full storage doesn't fail the build.
      - name: Upload APK
        uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: mindquest-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3

  chat-function:
    name: Edge function tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions/chat
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format and lint
        run: deno fmt --check && deno lint

      - name: Type check
        run: deno check index.ts

      - name: Unit tests
        run: deno test

      - name: Delete-account function (format, lint, type check)
        working-directory: supabase/functions/delete-account
        run: deno fmt --check && deno lint && deno check index.ts

      - name: Health function (format, lint, type check)
        working-directory: supabase/functions/health
        run: deno fmt --check && deno lint && deno check index.ts

  # Puts the Edge Functions (chat, delete-account, health) online after every
  # change to main that passes the checks, so the server always runs the code
  # in the repository. Skipped until the SUPABASE_ACCESS_TOKEN secret is added
  # (Supabase → Account → Access Tokens; see supabase/README.md).
  deploy-functions:
    name: Deploy Edge Functions
    needs: [chat-function]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check the settings
        id: setup
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Edge Functions are not deployed automatically yet: add the SUPABASE_ACCESS_TOKEN secret (supabase/README.md)."
          fi

      - uses: actions/checkout@v5
        if: steps.setup.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.setup.outputs.ready == 'true'
        with:
          version: latest

      - name: Deploy
        if: steps.setup.outputs.ready == 'true'
        run: |
          for f in chat delete-account health; do
            supabase functions deploy "$f" --project-ref dqcgeugyhpiemucdypok --use-api
          done

  # Puts the website (and the admin dashboard) online on Netlify after every
  # change to main that passes the checks. Skipped until the Netlify and
  # Supabase settings are added to the repository (docs/web-version.md).
  deploy-web:
    name: Deploy website
    needs: [flutter, chat-function]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_ADMIN_SITE_ID: ${{ secrets.NETLIFY_ADMIN_SITE_ID }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      FEEDBACK_URL: ${{ vars.FEEDBACK_URL }}
    steps:
      - name: Check the settings
        id: setup
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::The website is not deployed yet: add the Netlify and Supabase settings (docs/web-version.md)."
          fi

      - uses: actions/checkout@v5
        if: steps.setup.outputs.ready == 'true'

      - uses: subosito/flutter-action@v2
        if: steps.setup.outputs.ready == 'true'
        with:
          channel: stable
          cache: true

      # Only public values: the project address and the publishable key,
      # which every web visitor's browser gets anyway.
      - name: Write the web settings
        if: steps.setup.outputs.ready == 'true'
        run: |
          flutter pub get
          jq -n --arg key "$SUPABASE_PUBLISHABLE_KEY" --arg feedback "$FEEDBACK_URL" \
            '{SUPABASE_URL: "https://dqcgeugyhpiemucdypok.supabase.co", SUPABASE_ANON_KEY: $key, FEEDBACK_URL: $feedback}' \
            > config/web.json

      - name: Deploy the student app
        if: steps.setup.outputs.ready == 'true'
        run: |
          flutter build web --release --no-web-resources-cdn --dart-define-from-file=config/web.json
          npx --yes netlify-cli@17 deploy --prod --dir=build/web --site="$NETLIFY_SITE_ID" --message="${GITHUB_SHA::7}"

      - name: Deploy the admin dashboard
        if: steps.setup.outputs.ready == 'true' && env.NETLIFY_ADMIN_SITE_ID != ''
        run: |
          flutter build web --release --no-web-resources-cdn -t lib/main_admin.dart --dart-define-from-file=config/web.json
          npx --yes netlify-cli@17 deploy --prod --dir=build/web --site="$NETLIFY_ADMIN_SITE_ID" --message="${GITHUB_SHA::7}"
